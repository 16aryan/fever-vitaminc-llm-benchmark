name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Format Check
        run: ruff format --check llm_fact_checker

      - name: Run Ruff Lint Check
        run: ruff check llm_fact_checker

  test:
    name: Unit & Golden Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab streamlit plotly

      - name: Run 162-Test Suite (Offline & Deterministic)
        run: python -m unittest discover -s tests -v

      - name: Verify Cross-Model Scorecard Execution
        run: python scripts/compare_models.py

      - name: Verify Dataset Schemas & Inspections
        run: python src/inspect_data.py --dataset all

      - name: Verify PDF Report Generation Pipeline
        run: python -c "import src.generate_pdf_report"

      - name: Verify Streamlit App Loading
        run: python -c "import app"
